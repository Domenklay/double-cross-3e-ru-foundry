name: Publish Double Cross v0.5.1

on:
  push:
    branches: [main]
    paths:
      - '.import-v0.5.1/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.5.1 update
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .import-v0.5.1/update.patch.gz.b64 | gzip -d > /tmp/v051.patch
          patch -p2 < /tmp/v051.patch
          cat .import-v0.5.1/actor-*.txt | base64 -d | gzip -d > module/sheets/actor-sheet.mjs
          echo '89081dae9a7a1cf581c22928d7a4392261f44ada0e03e6d2e10c3f4bf173a00e  module/sheets/actor-sheet.mjs' | sha256sum -c -
          grep -q '"version": "0.5.1"' system.json
          grep -q 'v0.5.1-EQUIPMENT-COMBO-FINAL.zip' system.json
          node --check module/combo-engine.mjs
          node --check module/sheets/actor-sheet.mjs
          node --check module/sheets/item-sheet.mjs
          node --check module/main.mjs

      - name: Build v0.5.1 install package
        shell: bash
        run: |
          set -euo pipefail
          cp README_RU.md README.md
          rm -rf /tmp/dx3-stage
          mkdir -p /tmp/dx3-stage/double-cross-3e-ru
          for path in LICENSE.txt README_RU.md docs lang module styles system.json templates assets; do
            if [ -e "$path" ]; then cp -a "$path" /tmp/dx3-stage/double-cross-3e-ru/; fi
          done
          mkdir -p dist
          rm -f dist/*.zip
          (cd /tmp/dx3-stage && zip -qr "$GITHUB_WORKSPACE/dist/double-cross-3e-ru-foundry-v14-v0.5.1-EQUIPMENT-COMBO-FINAL.zip" double-cross-3e-ru)
          unzip -t dist/double-cross-3e-ru-foundry-v14-v0.5.1-EQUIPMENT-COMBO-FINAL.zip

      - name: Clean import helpers and install build workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import-v0.5.1 .bootstrap
          rm -f .github/workflows/bootstrap.yml .github/workflows/import-v0.5.1.yml .github/workflows/publish-v0.5.0.yml
          cat > .github/workflows/build.yml <<'YAML'
          name: Build Foundry package

          on:
            push:
              branches: [main]
              paths-ignore:
                - 'dist/**'

          permissions:
            contents: write

          jobs:
            package:
              if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Build installable zip
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf /tmp/dx3-stage
                    mkdir -p /tmp/dx3-stage/double-cross-3e-ru
                    for path in LICENSE.txt README_RU.md docs lang module styles system.json templates assets; do
                      if [ -e "$path" ]; then cp -a "$path" /tmp/dx3-stage/double-cross-3e-ru/; fi
                    done
                    mkdir -p dist
                    rm -f dist/*.zip
                    (cd /tmp/dx3-stage && zip -qr "$GITHUB_WORKSPACE/dist/double-cross-3e-ru-foundry-v14-v0.5.1-EQUIPMENT-COMBO-FINAL.zip" double-cross-3e-ru)
                - name: Commit package
                  shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add dist/
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m 'Build Foundry package [skip ci]'
                    git push
          YAML

      - name: Commit v0.5.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Double Cross 3E RU v0.5.1 equipment and combo final [skip ci]'
          git push
