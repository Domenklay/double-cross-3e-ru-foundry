name: Bootstrap source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.txt | base64 -d > /tmp/double-cross.zip
          unzip -t /tmp/double-cross.zip
          rm -rf /tmp/double-cross-unpack
          mkdir -p /tmp/double-cross-unpack
          unzip -q /tmp/double-cross.zip -d /tmp/double-cross-unpack
          cp -a /tmp/double-cross-unpack/double-cross-3e-ru/. .
          mkdir -p dist
          cp /tmp/double-cross.zip dist/double-cross-3e-ru-foundry-v14-v0.5.0-EQUIPMENT-COMBO-UI.zip
          rm -rf .bootstrap
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import Double Cross 3E RU v0.5.0 source [skip ci]"
          git push
