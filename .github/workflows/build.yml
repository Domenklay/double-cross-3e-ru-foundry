name: Build Foundry package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dx3-stage
          mkdir -p /tmp/dx3-stage/double-cross-3e-ru
          for path in LICENSE.txt README_RU.md docs lang module styles system.json templates assets; do
            if [ -e "$path" ]; then cp -a "$path" /tmp/dx3-stage/double-cross-3e-ru/; fi
          done
          mkdir -p dist
          (cd /tmp/dx3-stage && zip -qr "$GITHUB_WORKSPACE/dist/double-cross-3e-ru-foundry-v14-v0.5.0-EQUIPMENT-COMBO-UI.zip" double-cross-3e-ru)
      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Foundry package [skip ci]"
          git push
